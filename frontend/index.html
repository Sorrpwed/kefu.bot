<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>AI客服</title>
<style>
body{background:#f6f8fc;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif}
.box{width:450px;height:600px;background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.1);display:flex;flex-direction:column;overflow:hidden}
.head{background:#4f6ef7;color:#fff;padding:20px;font-weight:600}
.msg{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:#fafbfc}
.m{max-width:75%;padding:12px 16px;border-radius:18px;font-size:15px}
.u{background:#4f6ef7;color:#fff;align-self:flex-end}
.b{background:#e9edf4;align-self:flex-start}
.inp{display:flex;border-top:1px solid #eee;padding:12px;gap:10px}
.inp input{flex:1;border:1px solid #ccc;border-radius:40px;padding:10px 16px;outline:none}
.inp button{background:#4f6ef7;color:#fff;border:none;padding:10px 22px;border-radius:40px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<div class="head">💬 AI 客服机器人</div>
<div class="msg" id="m"><div class="m b">你好！有什么可以帮你的吗？</div></div>
<div class="inp"><input id="i" placeholder="输入问题..." /><button id="b">发送</button></div>
</div>
<script>
const m=document.getElementById('m'),i=document.getElementById('i'),b=document.getElementById('b');
const API=location.origin.includes('127.0.0.1')?'http://127.0.0.1:8000':location.origin;
function add(t,u){const d=document.createElement('div');d.className='m '+(u?'u':'b');d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight;}
async function send(){const t=i.value.trim();if(!t)return;add(t,true);i.value='';b.disabled=true;try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});const rd=r.body.getReader(),dc=new TextDecoder();let f='';const bd=document.createElement('div');bd.className='m b';m.appendChild(bd);while(true){const{value,done}=await rd.read();if(done)break;for(const ln of dc.decode(value).split('\n')){if(ln.startsWith('data: ')){try{const p=JSON.parse(ln.slice(6));if(p.content){f+=p.content;bd.textContent=f;m.scrollTop=m.scrollHeight;}}catch(e){}}}}}catch(e){add('出错：'+e.message,false);}b.disabled=false;}
b.onclick=send;i.onkeydown=e=>{if(e.key==='Enter')send();};
</script>
</body>
</html>
